name: refresh-prices
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated subset of tickers.txt symbols to pull (blank = whole universe)"
        required: false
        default: ""
        type: string
  push:
    paths:
      - tickers.txt
      - .github/workflows/refresh.yml
      - "scripts/**"
  schedule:
    - cron: "20 9 * * 1"   # Mondays 09:20 UTC
    - cron: "20 10 * * 2"  # Tuesdays 10:20 UTC: picks up Value Scout additions before the 13:05 UTC run
permissions:
  contents: write
concurrency:
  group: refresh-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          # Check out the branch tip at run time, not the commit recorded when
          # the run was queued: a run held back by the concurrency group would
          # otherwise start from a stale commit and its push would be rejected.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
      - run: pip install --quiet "yfinance[repair]" pandas   # [repair] = scipy + scikit-learn, needed for repair=True
      - name: merge Value Scout additions
        env:
          VS_ADDITIONS_CSV_URL: ${{ vars.VS_ADDITIONS_CSV_URL }}
        run: python scripts/merge_additions.py
      - name: pull
        env:
          SUBSET: ${{ inputs.tickers }}
        run: python scripts/pull.py
      - name: validate
        run: python scripts/validate.py
      - name: commit
        run: |
          git config user.name "gh-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tickers.txt prices pull_status.csv validation.csv monthly_returns.csv
          git commit -m "refresh $(date -u +%F)" || echo "no changes"
          # If the branch moved while we were pulling, replay our commit on top.
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
